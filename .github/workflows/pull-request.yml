name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: Typescript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm generate:icons

      - name: Run typescript check
        run: pnpm typecheck

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm biome check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm generate:icons

      - name: Run tests
        run: pnpm test

  build:
    name: Build & Treeshake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Smoke-test that every path in package.json#exports actually exists in
      # dist/. Catches silent regressions from plugin option renames (e.g.
      # vite-plugin-dts outDir → outDirs) that don't surface as build errors.
      - name: Smoke-test build artifacts
        run: |
          set -e
          test -f dist/main.js
          test -f dist/main.d.ts
          test -f dist/components/button/index.js
          test -f dist/components/button/index.d.ts
          test -f dist/fonts/index.css
          test -f dist/fonts/index.d.ts
          test -f dist/tokens/index.css
          test -f dist/tokens/index.d.ts
          test -n "$(ls dist/icons/*.svg 2>/dev/null)"
          test -n "$(ls dist/images/* 2>/dev/null)"
          test -f dist/icons/THIRD_PARTY_NOTICES.md

      - name: Treeshake check
        run: pnpm test:treeshake:quick
